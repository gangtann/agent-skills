<!doctype html><html><head><meta charset="utf-8"><style>
/* 竖版封面：node rec.js cover 封面.png 300 → 裁成 1080×1440（3:4，抖音封面比例），可见区域是 y 300–1740
   用片中最强的一个画面做底（复用 shots.js 里的绘制函数），叠一层压暗，再放：小字主题 + 两行大标题（一个问题或反差）+ 一行副标题 */
*{margin:0;padding:0}html,body{width:1080px;height:1920px;background:#05080f;overflow:hidden}
canvas{position:absolute;left:0;top:0}
.k{position:absolute;left:96px;top:390px;font:600 34px "PingFang SC";letter-spacing:12px;color:#ffb35a}
.h{position:absolute;left:90px;top:450px;font:900 112px/1.22 "Songti SC";color:#eef2f7;text-shadow:0 6px 50px rgba(0,0,0,.8)}
.s{position:absolute;left:98px;top:1590px;font:500 34px "PingFang SC";color:#c9d3e3;letter-spacing:2px}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<div class="k">主 题 词</div><div class="h">封面标题<br>第二行</div>
<div class="s">副标题：片名或核心问题</div>
<script src="lib.js"></script><script src="shots.js"></script>
<script>const x=document.getElementById('c').getContext('2d');
vgrad(x,[[0,'#04070d'],[.6,'#0a1322'],[1,'#04060b']]);bokeh(x,11,22,1.0,{rmin:40,rmax:160,a:.12,drift:0,cols:[C.cold,C.amber]});
x.setTransform(1,0,0,1,0,0);const g=x.createLinearGradient(0,300,0,900);g.addColorStop(0,'rgba(4,7,13,.85)');g.addColorStop(1,'rgba(4,7,13,0)');x.fillStyle=g;x.fillRect(0,300,1080,600);
grainVignette(x,0.3,.05);</script></body></html>
