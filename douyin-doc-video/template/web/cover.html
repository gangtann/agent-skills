<!doctype html><html><head><meta charset="utf-8"><style>
/* 横封面：node rec.js cover 封面.png → 1440×1080（4:3，抖音横屏视频的封面比例）
   底图用片中最强的一帧实拍：bin/ffmpeg -ss <秒> -i footage/<id>.mp4 -frames:v 1 -q:v 2 web/cover_bg.jpg
   主体（人物/灯光）放右侧，左侧压暗放：小字主题 + 大标题（一个问题或反差）+ 一行副标题（一个核实过的数字）
   封面在手机信息流里会被缩得很小：大标题 ≥120px，每行 ≤5–6 字，最多三行；副标题不要和标题重叠
   横屏视频还要单独做 3:4 竖封面（cover_v.html，node rec.js cover34）：抖音从横封面自动裁的竖封面会切掉标题 */
*{margin:0;padding:0}html,body{width:1440px;height:1080px;background:#05080f;overflow:hidden}
canvas{position:absolute;left:0;top:0}
.k{position:absolute;left:110px;top:250px;font:600 38px "PingFang SC";letter-spacing:12px;color:#ffb35a}
.h{position:absolute;left:100px;top:320px;font:900 120px/1.25 "Songti SC";color:#eef2f7;text-shadow:0 6px 50px rgba(0,0,0,.8)}
.s{position:absolute;left:112px;top:850px;font:500 40px/1.6 "PingFang SC";color:#c9d3e3;letter-spacing:2px}
</style></head><body><canvas id="c" width="1440" height="1080"></canvas>
<div class="k">主 题 词</div><div class="h">封面标题<br>第二行<br>第三行？</div>
<div class="s">副标题：一个数字 <span style="color:#ffb35a">4.4 亿</span></div>
<script src="lib.js"></script><script src="shots.js"></script>
<script>
const x = document.getElementById('c').getContext('2d'), im = new Image();
const finish = () => {
  x.globalCompositeOperation = 'screen'; x.fillStyle = '#0e1c33'; x.fillRect(0, 0, 1440, 1080); x.globalCompositeOperation = 'source-over';
  const g = x.createLinearGradient(0, 0, 1000, 0); g.addColorStop(0, 'rgba(4,7,13,.85)'); g.addColorStop(.6, 'rgba(4,7,13,.5)'); g.addColorStop(1, 'rgba(4,7,13,0)');
  x.fillStyle = g; x.fillRect(0, 0, 1000, 1080); grainVignette(x, 0.3, .04); document.title = 'ready';   // rec.js 等 title=ready 才截图
};
im.onload = () => {   // 1920×1080 的帧左移 480，取右侧 1440 宽（主体在右）
  x.filter = 'brightness(1.25) contrast(1.05) saturate(.9)'; x.drawImage(im, 0, 0, 1920, 1080, -480, 0, 1920, 1080); x.filter = 'none'; finish();
};
im.onerror = () => {  // 没有 cover_bg.jpg 时用光斑背景
  vgrad(x, [[0, '#04070d'], [.6, '#0a1322'], [1, '#04060b']]); bokeh(x, 11, 22, 1.0, { rmin: 40, rmax: 160, a: .12, drift: 0, cols: [C.cold, C.amber] }); finish();
};
im.src = 'cover_bg.jpg';
</script></body></html>
