<!doctype html><html><head><meta charset="utf-8"><style>
/* 横封面：node rec.js cover 封面.png → 1440×1080（4:3，抖音横屏视频的封面比例）
   用片中最强的一个画面做底（复用 shots.js 里的绘制函数），左侧压暗，再放：小字主题 + 两行大标题（一个问题或反差）+ 一行副标题
   封面在手机信息流里会被缩得很小：大标题 ≥120px，最多两行、每行 ≤8 字 */
*{margin:0;padding:0}html,body{width:1440px;height:1080px;background:#05080f;overflow:hidden}
canvas{position:absolute;left:0;top:0}
.k{position:absolute;left:120px;top:250px;font:600 38px "PingFang SC";letter-spacing:12px;color:#ffb35a}
.h{position:absolute;left:112px;top:320px;font:900 128px/1.22 "Songti SC";color:#eef2f7;text-shadow:0 6px 50px rgba(0,0,0,.8)}
.s{position:absolute;left:120px;top:720px;font:500 38px "PingFang SC";color:#c9d3e3;letter-spacing:2px}
</style></head><body><canvas id="c" width="1440" height="1080"></canvas>
<div class="k">主 题 词</div><div class="h">封面标题<br>第二行</div>
<div class="s">副标题：片名或核心问题</div>
<script src="lib.js"></script><script src="shots.js"></script>
<script>const x=document.getElementById('c').getContext('2d');
vgrad(x,[[0,'#04070d'],[.6,'#0a1322'],[1,'#04060b']]);bokeh(x,11,22,1.0,{rmin:40,rmax:160,a:.12,drift:0,cols:[C.cold,C.amber]});
x.setTransform(1,0,0,1,0,0);const g=x.createLinearGradient(0,0,1000,0);g.addColorStop(0,'rgba(4,7,13,.85)');g.addColorStop(1,'rgba(4,7,13,0)');x.fillStyle=g;x.fillRect(0,0,1000,1080);
grainVignette(x,0.3,.05);</script></body></html>
